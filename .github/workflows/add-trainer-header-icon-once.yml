name: Add trainer header icon once
on:
  push:
    paths:
      - '.github/workflows/add-trainer-header-icon-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Respawn icon to trainer headers
        run: |
          python - <<'PY'
          from pathlib import Path

          icon = 'data:image/png;base64,'

          for rel in ('trainer/horie/index.html', 'trainer/ihara/index.html'):
              p = Path(rel)
              s = p.read_text(encoding='utf-8')

              old_css = '.brand{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-decoration:none;line-height:1}.brand-kicker{font-family:"GFS Didot",serif;font-size:11px;font-weight:400;letter-spacing:.19em;line-height:1.05;white-space:nowrap}.brand-name{font-family:"GFS Didot",serif;font-size:28px;font-weight:400;letter-spacing:-.015em;line-height:.95;white-space:nowrap}.back{font-size:13px;font-weight:700;text-decoration:none}'
              new_css = '.brand{display:inline-flex;align-items:center;gap:7px;text-decoration:none;line-height:1}.brand-symbol{width:38px;height:38px;flex:0 0 38px;object-fit:contain}.brand-copy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1}.brand-kicker{font-family:"GFS Didot",serif;font-size:11px;font-weight:400;letter-spacing:.19em;line-height:1.05;white-space:nowrap}.brand-name{font-family:"GFS Didot",serif;font-size:28px;font-weight:400;letter-spacing:-.015em;line-height:.95;white-space:nowrap}.back{font-size:13px;font-weight:700;text-decoration:none}'
              if s.count(old_css) != 1:
                  raise SystemExit(f'{rel}: header CSS match count {s.count(old_css)}')
              s = s.replace(old_css, new_css, 1)

              old_mobile = '.header-inner{height:64px}.brand-kicker{font-size:9px;letter-spacing:.18em}.brand-name{font-size:23px}.hero{padding:58px 0 54px}'
              new_mobile = '.header-inner{height:64px}.brand-symbol{width:31px;height:31px;flex-basis:31px}.brand-kicker{font-size:9px;letter-spacing:.18em}.brand-name{font-size:23px}.hero{padding:58px 0 54px}'
              if s.count(old_mobile) != 1:
                  raise SystemExit(f'{rel}: mobile CSS match count {s.count(old_mobile)}')
              s = s.replace(old_mobile, new_mobile, 1)

              old_html = '<a class="brand" href="../../"><span class="brand-kicker">Personal Gym</span><span class="brand-name">Respawn</span></a>'
              new_html = f'<a class="brand" href="../../"><img class="brand-symbol" src="{icon}" alt=""><span class="brand-copy"><span class="brand-kicker">Personal Gym</span><span class="brand-name">Respawn</span></span></a>'
              if s.count(old_html) != 1:
                  raise SystemExit(f'{rel}: header HTML match count {s.count(old_html)}')
              s = s.replace(old_html, new_html, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify diff
        run: |
          git diff --check
          git diff --stat
          git diff -- trainer/horie/index.html trainer/ihara/index.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trainer/horie/index.html trainer/ihara/index.html
          git commit -m 'Add Respawn icon to trainer headers'
          git push
