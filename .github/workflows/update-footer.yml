name: One-time Ihara wording update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-footer.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact wording and verify trainer header icons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          exact = 'マッスルゲート奈良 タンクトップ優勝'

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          pattern_top = r'<li>(?=[^<]*マッスルゲート奈良)(?=[^<]*優勝)[^<]*</li>'
          matches_top = re.findall(pattern_top, index)
          if len(matches_top) != 1:
              raise SystemExit(f'homepage Ihara award candidate count={len(matches_top)}: {matches_top}')
          index = re.sub(pattern_top, f'<li>{exact}</li>', index, count=1)
          index_path.write_text(index, encoding='utf-8')

          ihara_path = Path('trainer/ihara/index.html')
          ihara = ihara_path.read_text(encoding='utf-8')
          pattern_stat = r'<div class="stat"><strong>[^<]*</strong><span>[^<]*マッスルゲート奈良[^<]*</span></div>'
          pattern_record = r'<p class="record">[^<]*マッスルゲート奈良[^<]*</p>'
          stat_matches = re.findall(pattern_stat, ihara)
          record_matches = re.findall(pattern_record, ihara)
          if len(stat_matches) != 1:
              raise SystemExit(f'Ihara stat candidate count={len(stat_matches)}: {stat_matches}')
          if len(record_matches) != 1:
              raise SystemExit(f'Ihara record candidate count={len(record_matches)}: {record_matches}')
          ihara = re.sub(pattern_stat, '<div class="stat"><strong>マッスルゲート奈良</strong><span>タンクトップ優勝</span></div>', ihara, count=1)
          ihara = re.sub(pattern_record, f'<p class="record">{exact}</p>', ihara, count=1)
          if ihara.count('class="brand-symbol"') != 1:
              raise SystemExit('Ihara trainer header symbol missing or duplicated')
          ihara_path.write_text(ihara, encoding='utf-8')

          horie = Path('trainer/horie/index.html').read_text(encoding='utf-8')
          if horie.count('class="brand-symbol"') != 1:
              raise SystemExit('Horie trainer header symbol missing or duplicated')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trainer/ihara/index.html
          git commit -m 'Unify Ihara competition wording'
          git push
