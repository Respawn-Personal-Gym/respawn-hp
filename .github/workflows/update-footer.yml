name: One-time Ihara wording update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-footer.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact wording and verify trainer header icons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          exact = 'マッスルゲート奈良 タンクトップ優勝'

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index, n_top = re.subn(
              r'<li>2022年\s*マッスルゲート奈良\s*優勝</li>',
              f'<li>{exact}</li>',
              index,
              count=1,
          )
          if n_top != 1:
              raise SystemExit(f'homepage Ihara award replacement count={n_top}')
          index_path.write_text(index, encoding='utf-8')

          ihara_path = Path('trainer/ihara/index.html')
          ihara = ihara_path.read_text(encoding='utf-8')
          ihara, n_stat = re.subn(
              r'<div class="stat"><strong>[^<]*優勝</strong><span>[^<]*マッスルゲート奈良[^<]*</span></div>',
              '<div class="stat"><strong>マッスルゲート奈良</strong><span>タンクトップ優勝</span></div>',
              ihara,
              count=1,
          )
          ihara, n_record = re.subn(
              r'<p class="record">[^<]*マッスルゲート奈良[^<]*優勝</p>',
              f'<p class="record">{exact}</p>',
              ihara,
              count=1,
          )
          if n_stat != 1 or n_record != 1:
              raise SystemExit(f'Ihara detail replacement stat={n_stat}, record={n_record}')
          if ihara.count('class="brand-symbol"') != 1:
              raise SystemExit('Ihara trainer header symbol missing or duplicated')
          ihara_path.write_text(ihara, encoding='utf-8')

          horie = Path('trainer/horie/index.html').read_text(encoding='utf-8')
          if horie.count('class="brand-symbol"') != 1:
              raise SystemExit('Horie trainer header symbol missing or duplicated')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trainer/ihara/index.html
          git commit -m 'Unify Ihara competition wording'
          git push
