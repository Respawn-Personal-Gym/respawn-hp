name: One-time trainer and competition update

on:
  push:
    paths:
      - '.github/workflows/update-footer.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested website changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL 'https://raw.githubusercontent.com/Respawn-Personal-Gym/respawn-hp/site-edits-20260918/assets/horie-fwj-award.jpg.b64' | base64 --decode > assets/horie-fwj-award.jpg
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          old = '2022 マッスルゲート奈良 優勝'
          new = '2022 マッスルゲート奈良 タンクトップ優勝'
          index = index.replace(old, new)

          m = re.search(r'<section class="competition"[\s\S]*?</section>', index)
          if not m:
              raise SystemExit('competition section not found')
          section = m.group(0)
          section2, n = re.subn(
              r'(<article class="comp-card"[^>]*>[\s\S]*?<img\b[^>]*?\bsrc=")[^"]+("[^>]*>)',
              r'\1assets/horie-fwj-award.jpg\2',
              section,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Horie competition image replacement count={n}')
          index = index[:m.start()] + section2 + index[m.end():]
          index_path.write_text(index, encoding='utf-8')

          ihara_path = Path('trainer/ihara/index.html')
          ihara = ihara_path.read_text(encoding='utf-8').replace(old, new)
          if 'class="brand-symbol"' not in ihara:
              raise SystemExit('Ihara trainer header symbol missing')
          ihara_path.write_text(ihara, encoding='utf-8')

          horie = Path('trainer/horie/index.html').read_text(encoding='utf-8')
          if 'class="brand-symbol"' not in horie:
              raise SystemExit('Horie trainer header symbol missing')

          if new not in index or new not in ihara:
              raise SystemExit('Ihara achievement wording not updated in both pages')
          if 'assets/horie-fwj-award.jpg' not in index:
              raise SystemExit('Horie photo path missing from index')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trainer/ihara/index.html assets/horie-fwj-award.jpg
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update trainer competition presentation'
            git push
          fi
