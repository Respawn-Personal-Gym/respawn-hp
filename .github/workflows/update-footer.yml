name: One-time iOS date input fix

on:
  push:
    paths:
      - '.github/workflows/update-footer.yml'

permissions:
  contents: write

jobs:
  fix-ios-date-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix iOS date input overflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''  .date-row>div:nth-child(2){min-width:0;max-width:100%;overflow:hidden}\n  .date-row input[type="date"]{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box}'''
          new = '''  .date-row>div:nth-child(2){width:100%;min-width:0;max-width:100%}\n  .date-row input[type="date"]{display:block;width:100%;max-width:100%;min-width:0;inline-size:100%;min-inline-size:0;box-sizing:border-box;-webkit-appearance:none;appearance:none}'''
          if old not in s:
              raise SystemExit('Target CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix iOS date input overflow'
          git push
