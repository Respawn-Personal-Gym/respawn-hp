name: One-time Ihara wording update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-footer.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact wording and verify trainer header icons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          exact = 'マッスルゲート奈良 タンクトップ優勝'

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_top = '<li>2022年 マッスルゲート奈良 優勝</li>'
          new_top = f'<li>{exact}</li>'
          if index.count(old_top) != 1:
              raise SystemExit(f'homepage exact old wording count={index.count(old_top)}')
          index = index.replace(old_top, new_top, 1)
          index_path.write_text(index, encoding='utf-8')

          ihara_path = Path('trainer/ihara/index.html')
          ihara = ihara_path.read_text(encoding='utf-8')
          old_stat = '<div class="stat"><strong>優勝</strong><span>2022 マッスルゲート奈良</span></div>'
          new_stat = '<div class="stat"><strong>マッスルゲート奈良</strong><span>タンクトップ優勝</span></div>'
          old_record = '<p class="record">2022年 マッスルゲート奈良 初出場優勝</p>'
          new_record = f'<p class="record">{exact}</p>'
          if ihara.count(old_stat) != 1:
              raise SystemExit(f'Ihara stat old wording count={ihara.count(old_stat)}')
          if ihara.count(old_record) != 1:
              raise SystemExit(f'Ihara record old wording count={ihara.count(old_record)}')
          ihara = ihara.replace(old_stat, new_stat, 1).replace(old_record, new_record, 1)
          if ihara.count('class="brand-symbol"') != 1:
              raise SystemExit('Ihara trainer header symbol missing or duplicated')
          ihara_path.write_text(ihara, encoding='utf-8')

          horie = Path('trainer/horie/index.html').read_text(encoding='utf-8')
          if horie.count('class="brand-symbol"') != 1:
              raise SystemExit('Horie trainer header symbol missing or duplicated')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trainer/ihara/index.html
          git commit -m 'Unify Ihara competition wording'
          git push
