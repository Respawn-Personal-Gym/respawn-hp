name: Refine home wordmark once
on:
  push:
    paths:
      - '.github/workflows/refine-home-wordmark-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match home header wordmark to brand logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('.logo-lockup .brand-copy{\n      display:flex;\n      align-items:baseline;\n      gap:7px;\n    }', '.logo-lockup .brand-copy{\n      display:flex;\n      flex-direction:column;\n      align-items:center;\n      justify-content:center;\n      gap:0;\n      line-height:1;\n    }'),
              ('.logo-lockup .brand-kicker{\n      color:var(--text);\n      font-family:"Inter","Noto Sans JP",sans-serif;\n      font-size:17px;\n      font-weight:700;\n      letter-spacing:-.025em;\n    }', '.logo-lockup .brand-kicker{\n      color:var(--text);\n      font-family:"GFS Didot",serif;\n      font-size:11px;\n      font-weight:400;\n      letter-spacing:.19em;\n      line-height:1.05;\n      white-space:nowrap;\n    }'),
              ('.logo-lockup .brand-name{\n      color:var(--text)!important;\n      font-family:"GFS Didot",serif;\n      font-size:22px;\n      font-weight:400;\n      letter-spacing:.01em;\n    }', '.logo-lockup .brand-name{\n      color:var(--text)!important;\n      font-family:"GFS Didot",serif;\n      font-size:28px;\n      font-weight:400;\n      letter-spacing:-.015em;\n      line-height:.95;\n      white-space:nowrap;\n    }'),
              ('.logo-lockup .brand-kicker{font-size:12px}', '.logo-lockup .brand-kicker{font-size:9px;letter-spacing:.18em}'),
              ('.logo-lockup .brand-name{font-size:18px}', '.logo-lockup .brand-name{font-size:23px}'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one match, found {s.count(old)} for {old[:60]!r}')
              s = s.replace(old, new, 1)
          if 'class="brand-symbol"' not in s:
              raise SystemExit('brand symbol is missing from the home header')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify diff
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Match home header wordmark to brand logo'
          git push
