name: Anonymize one Google review once
on:
  push:
    paths:
      - '.github/workflows/anonymize-review-once.yml'
permissions:
  contents: write
jobs:
  anonymize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace reviewer name
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='嶋津知足 さん / Google口コミ'
          new='Sさん / Google口コミ'
          if old not in s:
              raise SystemExit('target text not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Anonymize Google reviewer name'
          git push
