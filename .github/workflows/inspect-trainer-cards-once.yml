name: Inspect trainer cards once
on:
  push:
    paths:
      - '.github/workflows/inspect-trainer-cards-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print trainer card context
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          for href in ('trainer/horie/', 'trainer/ihara/'):
              i = s.find(href)
              print('\n===== ', href, ' =====')
              print(s[max(0,i-1800):i+500])
          PY