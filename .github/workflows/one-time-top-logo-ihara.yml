name: One-time top logo and Ihara text update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-top-logo-ihara.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match homepage icon to trainer detail and fix Ihara title
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          top = Path('index.html')
          trainer = Path('trainer/horie/index.html')
          s = top.read_text(encoding='utf-8')
          t = trainer.read_text(encoding='utf-8')

          m = re.search(r'<img class="brand-symbol" src="([^"]+)"', t)
          if not m:
              raise SystemExit('trainer brand-symbol not found')
          shadow_src = m.group(1)

          hm = re.search(r'<header\b.*?</header>', s, flags=re.S)
          if not hm:
              raise SystemExit('homepage header not found')
          header = hm.group(0)
          header2, n_img = re.subn(r'(<img\b[^>]*\bsrc=")[^"]+("[^>]*>)', lambda m: m.group(1)+shadow_src+m.group(2), header, count=1, flags=re.S)
          if n_img != 1:
              raise SystemExit(f'homepage header image replacement count={n_img}')
          s = s[:hm.start()] + header2 + s[hm.end():]

          s, n_text = re.subn(r'2022\s*マッスルゲート奈良\s*(?:タンクトップ)?優勝', '2022 マッスルゲート奈良 タンクトップ優勝', s)
          if n_text < 1:
              raise SystemExit('Ihara homepage competition text not found')

          top.write_text(s, encoding='utf-8')
          print(f'updated header image: {n_img}, Ihara text occurrences: {n_text}')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && { echo 'No change'; exit 1; }
          git commit -m 'Match homepage brand icon and Ihara competition title'
          git push
